[project]
name = "blipark-backend"
version = "0.1.0"
description = "Backend and parking-data ingestion service for Blipark"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "django>=6.0,<6.1",
    "gunicorn>=23,<24",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.12,<3",
    "whitenoise>=6.12,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-django>=4.11,<5",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
